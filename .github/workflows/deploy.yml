name: Deploy to GitHub Pages

# Supply-chain hardening:
# - Every third-party action is pinned to a full commit SHA (not a mutable tag)
#   so a compromised/re-pointed action tag cannot alter this workflow.
# - npm installs use the committed .npmrc + package-lock.json which resolve
#   exclusively from registry.npmjs.org.
# - After the build, scripts/inject-security-headers.mjs stamps CSP and other
#   security policies into every shipped HTML file.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4 == 11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node@v4 == 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Stamp security headers into the static export.
      - run: node scripts/inject-security-headers.mjs

      # actions/configure-pages@v5 == 983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      # actions/upload-pages-artifact@v3 == 56afc609e74202658d3ffba0e8f6dda462b719fa
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # actions/deploy-pages@v4 == d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346